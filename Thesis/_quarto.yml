project:
  type: book
  output-dir: _book

draft: false

book:
  title: "Tax Evasion and Productivity"
  author:
    - name:
        given: Hans
        family: Martinez
  date: today
  date-format: "MMMM YYYY"            # title page shows the month and year
  chapters:
    - index.qmd                              # Abstract
    - frontmatter/lay-summary.qmd            # required, max 350 words
    - frontmatter/genai.qmd                  # required: use / non-use of GenAI
    - frontmatter/epigraph.qmd               # optional epigraph page (SGPS order: before the TOC)
    - frontmatter/lists.qmd                  # TOC + lists (template shortcode)
    - chapters/01-intro.qmd
    - chapters/03-setting-data.qmd
    - chapters/02-model.qmd
    - chapters/04-testing.qmd
    - chapters/05-deconvolution.qmd
    - chapters/06-pf-productivity.qmd
    - chapters/07-fiscal-policy.qmd
    - chapters/08-counterfactual.qmd
    - chapters/09-literature.qmd
    - chapters/10-conclusion.qmd
    - backmatter/references.qmd
  appendices:
    - appendices/A-elvis.qmd
    # - appendices/B-control-variate.qmd   # DROPPED 2026-09-23: CV not used in the thesis
    - appendices/C-msl.qmd
    - appendices/D-soc-model.qmd
    - appendices/E-pf-all-industries.qmd
    - appendices/F-test-robustness.qmd
    - appendices/G-fiscal-wedge.qmd
    - appendices/H-elasticity.qmd
    - backmatter/cv.qmd                      # Curriculum Vitae, required, always last

bibliography: biblio/references.bib

execute:
  echo: false
  warning: false

number-sections: true

# Title page and abstract (Western thesis template, _extensions/hans-mtz/westernthesis)
supervisor: ["Salvador Navarro", "David Rivers", "Timothy Conley"]
program: "Economics"
degree: "Doctor of Philosophy"
degree-level: doctoral
keywords:
  - Tax Evasion
  - Cost Overreporting
  - Production Function Estimation
  - Productivity

format:
  westernthesis-pdf:
    keep-tex: true
