title: Western Thesis
author: Hans Martinez
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  shortcodes:
    - shortcodes.lua
  formats:
    pdf:
      filters:
        - westernthesis.lua
      documentclass: report
      classoption: [oneside, openany]
      pdf-engine: lualatex
      papersize: letter
      fontsize: 12pt
      # STIX Two (a modern Times design) throughout: text, headings and math.
      # Loaded by file name from the TeX package `stix2-otf`, not from system fonts, so
      # every platform gets the same version, and TinyTeX users get the package
      # installed automatically by Quarto on the first render.
      mainfont: STIXTwoText
      mainfontoptions:
        - Extension=.otf
        - UprightFont=*-Regular
        - BoldFont=*-Bold
        - ItalicFont=*-Italic
        - BoldItalicFont=*-BoldItalic
      mathfont: STIXTwoMath-Regular.otf
      # SGPS §6.4: left >= 1.5in, top/bottom/right >= 1in. As in the SGPS Word
      # template, the header sits in the top margin (~0.55in from the edge; §6.6 needs
      # >= 0.5in) and the text starts at 1in.
      geometry:
        - left=1.5in
        - right=1in
        - top=1in
        - bottom=1in
        - headheight=15pt
        - headsep=0.2in
        - footskip=0.4in
      number-sections: true
      # Plates (photographs etc.) as their own numbered float with a List of Plates,
      # as in the SGPS Word template: a `::: {#plt-name}` div with an image and caption.
      crossref:
        custom:
          - kind: float
            key: plt
            reference-prefix: Plate
            latex-env: plate
            latex-list-of-file-extension: lopl
            latex-list-of-description: Plate
      # The TOC and lists are placed by the {{< western-lists >}} shortcode, after the
      # abstract, lay summary and acknowledgements (SGPS §1.4 order).
      toc-depth: 3
      template-partials:
        - partials/before-title.tex
        - partials/before-body.tex
        - partials/toc.tex
      # Thesis options (documented in _schema.yml)
      line-spacing: onehalf        # onehalf | double
      running-headers: true
      title-page: true             # SGPS Word template title page (page i, unnumbered)
      chapter-bibliographies: false  # true: a reference list at the end of each chapter
      chapter-bibliography-title: References
